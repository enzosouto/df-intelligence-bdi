name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A SSP-DF publica mensalmente; o CNES atualiza mensalmente.
    # Todo dia 5, 06:00 UTC (03:00 em Brasília).
    - cron: "0 6 5 * *"
  workflow_dispatch:
    inputs:
      run_ingestion:
        description: "Executar a ingestão completa (acessa as fontes públicas)"
        type: boolean
        default: false
      screenshots:
        description: "Após a ingestão, subir API + frontend e capturar as telas com dados reais"
        type: boolean
        default: false

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: df
  POSTGRES_PASSWORD: df_ci_password
  POSTGRES_DB: df_intelligence
  DATABASE_URL: postgresql://df:df_ci_password@localhost:5432/df_intelligence

jobs:
  # ---------------------------------------------------------------------------
  # Testes que não dependem de rede nem de banco: rodam em todo push e PR.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: pytest
        run: pytest tests/test_security_parser.py tests/test_ingestion_units.py tests/test_education_parser.py tests/test_mobility.py tests/test_scheduler.py

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # As fontes públicas ainda existem e respondem como documentado?
  # ---------------------------------------------------------------------------
  validate-sources:
    name: Validar fontes públicas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testar acesso a cada fonte
        run: python -m ingestion.validate_sources

  # ---------------------------------------------------------------------------
  # Pipeline completo contra um Postgres efêmero.
  #
  # A ingestão real (~10 min, ~500 requisições a portais públicos) só roda no
  # agendamento mensal ou sob demanda — não em cada PR, para não martelar os
  # servidores do GDF.
  # ---------------------------------------------------------------------------
  pipeline:
    name: Ingestão + dbt + testes de integração
    runs-on: ubuntu-latest
    needs: [unit-tests, validate-sources]
    # Necessário para o passo que commita o README e as telas de volta.
    permissions:
      contents: write
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_ingestion)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: df
          POSTGRES_PASSWORD: df_ci_password
          POSTGRES_DB: df_intelligence
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingestão (fontes → raw)
        run: python -m ingestion

      - name: dbt seed + build (modelos e testes de qualidade)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DBT_POSTGRES_HOST: localhost
          DBT_POSTGRES_PORT: "5432"
          DBT_POSTGRES_USER: df
          DBT_POSTGRES_PASSWORD: df_ci_password
          DBT_POSTGRES_DB: df_intelligence
        run: |
          dbt seed --no-version-check
          dbt build --no-version-check

      - name: Testes de integração da API
        # Mesmas versões pinadas da imagem da API: o teste vale para o que vai
        # para produção, não para a última versão do PyPI.
        run: pip install -r api/requirements.txt httpx && pytest tests/test_api_integration.py

      # Os números e as telas do README saem do banco desta execução, e o que
      # mudou volta commitado. Documentação escrita à mão apodrece: um README
      # que afirma 70.035 ocorrências quando o banco tem outra coisa é
      # exatamente o dado inventado que este projeto promete não publicar.
      - name: Atualizar README e telas com os dados desta execução
        if: github.event_name == 'schedule' || inputs.screenshots
        env:
          API_CORS_ORIGINS: http://localhost:5173
        run: |
          python scripts/update_readme_stats.py
          pip install -q playwright==1.49.1 && python -m playwright install --with-deps chromium > /dev/null
          (cd frontend && npm ci --silent)
          nohup uvicorn api.main:app --port 8000 > /tmp/api.log 2>&1 &
          (cd frontend && nohup npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf localhost:8000/api/health-check > /dev/null && curl -sf localhost:5173 > /dev/null && break
            sleep 1
          done
          python scripts/screenshots.py || (tail -50 /tmp/api.log /tmp/vite.log; exit 1)

      - name: Commitar o que mudou
        if: github.event_name == 'schedule' || inputs.screenshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots
          git diff --staged --quiet && echo "nada mudou" && exit 0
          git commit -m "chore: números e telas do README a partir da execução de $(date +%Y-%m-%d)"
          git push

      - name: Relatório do pipeline
        if: always()
        run: |
          psql "$DATABASE_URL" -c "
            select source_key, status, rows_written, requests_made, error_message
            from meta.ingestion_run
            where started_at > now() - interval '2 hours'
            order by started_at;"
          psql "$DATABASE_URL" -c "
            select check_name, severity, passed, left(observed, 80) as observed
            from meta.data_quality_check
            where checked_at > now() - interval '2 hours' and not passed
            order by severity;"
          psql "$DATABASE_URL" -c "
            select census_year, sector, schools_in_registry, schools_in_enrollment_file, coverage, is_complete
            from marts.mart_education_coverage order by census_year, sector;" || true
          psql "$DATABASE_URL" -c "
            select census_year, is_year_complete, schools_total, enrollment_total, early_childhood,
                   elementary, high_school_all, youth_adult, enrollment_public_share_pct
            from marts.mart_education_yearly where scope = 'DF' order by census_year;" || true
          psql "$DATABASE_URL" -c "
            select region_assignment, count(*), count(*) filter (where coordinate_agrees_with_declaration) as agree,
                   count(*) filter (where not coordinate_agrees_with_declaration) as disagree
            from intermediate.int_education_school_region group by 1;" || true
          psql "$DATABASE_URL" -c "
            select declared_region_id, region_id as coordinate_region_id, count(*)
            from intermediate.int_education_school_region
            where not coordinate_agrees_with_declaration
            group by 1, 2 order by 3 desc limit 20;" || true
          psql "$DATABASE_URL" -c "select insight_id, left(finding, 220) from marts.mart_insights order by 1;" || true
          psql "$DATABASE_URL" -c "select insight_id, value_numeric, finding from marts.mart_insights where domain = 'education' or insight_id like 'EDU%';" || true

      - name: Guardar artefatos do dbt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt/target/
          retention-days: 14

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Construir API, frontend e pipeline
        run: |
          docker build -f api/Dockerfile -t dfi-api .
          docker build -f frontend/Dockerfile -t dfi-frontend frontend
          docker build -f ingestion/Dockerfile -t dfi-pipeline .
