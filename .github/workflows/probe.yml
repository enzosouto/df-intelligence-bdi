# TEMPORÁRIO: sonda de fontes candidatas. Será removido.
name: probe
on:
  pull_request:
    paths: ["scripts/probe_sources.py", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        target: [reconcile, ra3435]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && timeout 300 python -u scripts/probe_sources.py ${{ matrix.target }}
