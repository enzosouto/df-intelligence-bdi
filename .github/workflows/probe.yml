# TEMPORÁRIO: sonda. Será removido.
name: probe
on:
  pull_request:
    paths: ["scripts/probe_sources.py", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt && python -u scripts/probe_sources.py
