name: df_intelligence
version: "1.0.0"
config-version: 2

profile: df_intelligence

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  df_intelligence:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      # Tabelas: a API lê daqui e precisa de leitura rápida e previsível.
      +materialized: table

seeds:
  df_intelligence:
    +schema: staging
    region_name_map:
      +column_types:
        ibge_subdistrict_id: bigint
        ra_number: integer
    security_nature_map:
      +column_types:
        is_violent: boolean
    education_ra_alias:
      +column_types:
        seedf_ra_name: text
