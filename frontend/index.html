<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: o layout usa env(safe-area-inset-*) para não ficar
         embaixo do notch nem da barra de gestos do iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DF Intelligence — Brasília através dos dados</title>
    <meta
      name="description"
      content="Camada analítica sobre dados públicos do Distrito Federal: população, segurança, saúde, educação, mobilidade e clima por Região Administrativa."
    />
    <meta name="theme-color" content="#060010" />

    <!-- Miniatura de compartilhamento (WhatsApp, LinkedIn, X, iMessage).
         Imagem gerada por scripts/og_image.py, 1200x630. A URL precisa ser
         absoluta: quem lê estas tags é o robô de cada rede, não o navegador. -->
    <link rel="canonical" href="https://df-intelligence-bdi.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="DF Intelligence" />
    <meta property="og:url" content="https://df-intelligence-bdi.vercel.app/" />
    <meta property="og:title" content="DF Intelligence — Brasília através dos dados" />
    <meta
      property="og:description"
      content="População, segurança, saúde, educação, mobilidade e clima nas 35 Regiões Administrativas do DF, com fontes oficiais e a lacuna de cada uma à mostra."
    />
    <meta property="og:image" content="https://df-intelligence-bdi.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DF Intelligence: Brasília através dos dados. Malha de cobertura das 35 Regiões Administrativas." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DF Intelligence — Brasília através dos dados" />
    <meta name="twitter:description" content="Dados públicos das 35 Regiões Administrativas do DF, com a lacuna de cada fonte à mostra." />
    <meta name="twitter:image" content="https://df-intelligence-bdi.vercel.app/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Instalável na tela inicial (Android e iOS), abre sem a barra do navegador. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DF Intelligence" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-night text-ink antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
