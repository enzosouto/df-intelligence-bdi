# Blueprint do Render: só a API. O banco é o Neon, o site é o Vercel, e quem
# escreve no banco é o GitHub Actions (.github/workflows/production-data.yml).
# Passo a passo em docs/deploy.md.
services:
  - type: web
    name: df-intelligence-api
    runtime: python
    # Mesma região AWS do banco no Neon (us-east-2, Ohio): a página de uma
    # RA faz várias consultas, e cada ida e volta entre regiões soma.
    region: ohio
    plan: free
    branch: main
    # Só redeploya quando algo da API muda; commit de frontend ou de dados não
    # derruba a API à toa.
    buildFilter:
      paths:
        - api/**
        - render.yaml
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health-check
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Conexão da role SÓ DE LEITURA (api_reader), nunca a dona do banco.
      # Preenchida no painel do Render; não fica no repositório.
      - key: DATABASE_URL
        sync: false
      # Domínio do site no Vercel, ex.: https://df-intelligence.vercel.app
      - key: API_CORS_ORIGINS
        sync: false
      # Previews do Vercel (um domínio por deploy). Dados públicos, só GET.
      - key: API_CORS_ORIGIN_REGEX
        value: ^https://df-intelligence(-[a-z0-9]+)*-enzos-projects-a7fcb69e\.vercel\.app$
      - key: DB_POOL_MAX
        value: "5"
